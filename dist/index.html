<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics 101: The Mechanics Odyssey — Educational Puzzle-Platformer</title>
    <meta
      name="description"
      content="Physics 101: The Mechanics Odyssey is a rigorous educational physics puzzle-platformer exploring mechanics, kinematics, and circular motion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-xJz-IV5g.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DOYN-pCY.css">
  </head>
  <body>
    <div id="app" class="game-container">
      <!-- Symmetrical Top Navigation Header -->
      <header class="game-header">
        <div class="header-brand">
          <span class="brand-badge">PHYSICS 101</span>
          <h1 class="brand-title">The Mechanics Odyssey</h1>
          <div class="axel-status-pill">
            <span id="axelHealthDisplay" class="status-hearts" title="Axel Health">❤️❤️❤️</span>
            <span id="coresDisplay" class="status-cores" title="Physics Cores Collected">💠 CORES: 0</span>
          </div>
        </div>

        <div class="header-center">
          <div class="control-group">
            <label for="level-select">Mission:</label>
            <select id="level-select" class="nav-select">
              <option value="0" selected>🏛️ Central Hub: Mechanics Nexus</option>
              <option value="1">Level 1: The Wandering Path (Distance vs. Displacement)</option>
              <option value="2">Level 2: Speed vs. Velocity</option>
              <option value="3">Level 3: Acceleration</option>
              <option value="4">Level 4: UARM Kinematics</option>
              <option value="5">Level 5: Rotation & Period</option>
              <option value="6">Level 6: Linear vs. Rotational Speed</option>
              <option value="7">Level 7: Tangential Velocity & ac</option>
              <option value="8">Level 8: Centripetal Force</option>
              <option value="9">🔬 Free Play Physics Sandbox</option>
            </select>
          </div>
        </div>

        <div class="header-controls">
          <div class="quick-nav-group">
            <button class="btn btn-secondary" id="btn-quick-hub" title="Return to Central Hub (Key: H)">🏛️ Hub</button>
            <button class="btn btn-secondary" id="btn-quick-sandbox" title="Open Physics Sandbox">🔬 Sandbox</button>
          </div>

          <div class="action-btn-group">
            <button class="btn btn-tutorial" id="btn-tutorial-open" title="Open Mission Guide & Instructions">📖 Guide</button>
            <button class="btn btn-icon active" id="btn-vectors-toggle" title="Toggle Physical Vectors (F2 / V)">⚡ Vectors</button>
            <button class="btn btn-icon" id="btn-slowmo-toggle" title="Toggle Slow Motion (F6)">⏳ Slow-Mo</button>
            <button class="btn btn-icon" id="btn-sound-toggle" title="Toggle Audio Feedback">🔊 Sound</button>
            <button class="btn btn-icon" id="btn-pause-toggle" title="Pause / Resume (Key: P)">⏸️ Pause</button>
            <button class="btn btn-icon" id="btn-reset" title="Instant Respawn / Restart (Key: R)">🔄 Reset</button>
          </div>
        </div>
      </header>

      <!-- Main Game Viewport -->
      <main class="game-main">
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="960" height="600"></canvas>
          <div id="modalContainer" class="modal-overlay" style="display: none;"></div>

          <!-- Level-Specific Action Dock (minimal, bottom center, unobtrusive) -->
          <div class="level-specific-dock" id="levelSpecificDock">
            <!-- Dynamically populated per active level (e.g. sandbox spawn crate, gravity buttons) -->
          </div>
        </div>

        <!-- Real-time Synchronized Physics HUD (Right Sidebar with Telemetry, Formula, Goal & Controls) -->
        <aside id="educationalHUD" class="hud-panel" aria-label="Physics Telemetry HUD">
          <!-- Populated dynamically by EducationalHUD.render -->
        </aside>
      </main>
    </div>

  </body>
</html>
